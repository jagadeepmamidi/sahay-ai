version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahay-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend/data:/app/data
    networks:
      - sahay-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sahay-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - sahay-network

networks:
  sahay-network:
    driver: bridge
